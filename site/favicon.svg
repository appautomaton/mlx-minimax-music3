    <rect x="6" y="11" width="16" height="2" rx="1"/>
    <rect x="6" y="15" width="12" height="2" rx="1"/>
    <rect x="6" y="19" width="8"  height="2" rx="1"/>
  </g>
  <rect x="6" y="23" width="5" height="2" rx="1" fill="#fb7bac"/>
</svg>
