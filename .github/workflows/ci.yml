name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.4"
      - name: Install Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --locked
      - name: Check version metadata
        run: uv run python dev/check_version.py
      - name: Check public tree
        run: uv run python dev/check_public_tree.py
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q tests/unit
      - name: Weightless integration tests
        run: uv run pytest -q tests/integration
      - name: Build
        run: uv build --no-sources
